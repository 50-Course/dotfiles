# nothing to see here, just me keeping my tmux bindings in a separate file for better organization

unbind C-b
unbind -n M-h

bind ^D detach
bind R source-file ~/.tmux.conf \; display-message 'successful reloaded, tmux src-file' 
bind ^A last-window     # switch to the last active window
bind w list-windows     # list all windows in the current session
bind r command-prompt "rename-window '%%'" # rename the current window with a prompt
bind % command-prompt "rename-session '%%'" # rename the current session with a prompt
bind ^X swap-pane -D
bind * synchronize-panes # send input to all panes in the current window
bind -r -T prefix , resize-pane -L 15 # resize pane left by 15 cells
bind -r -T prefix . resize-pane -R 15 # resize pane left by 15 cells
bind -r -T prefix - resize-pane -D 7 # resize pane left by 7 cells
bind -r -T prefix = resize-pane -U 7 # resize pane left by 7 cells

# spilt windows [H]orizontally and [V]erticurlly, you know what i mean?
bind -n M-v split-window -v # split top and bottom - veritically
bind -n M-d split-window -h # split side by side - horizontally  (diagonal)

bind q kill-session

bind z resize-pane -Z # toggle zoom for the current pane

# Tmux workspace manager using tmux session manager and window manager
bind-key -r C-f run-shell 'tmux neww ~/.local/scripts/tmux-sess-man'

# Search for stuffs with cheat sheet
bind-key -r C-b run-shell 'tmux neww ~/.local/scripts/tmux-cht-sh'

bind K send-keys "clear"\; send-keys "Enter"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
